apiVersion: apps/v1
kind: Deployment
metadata:
  name: member-mgmt-deployment
  labels:
    app: member-mgmt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: member-mgmt
  template:
    metadata:
      labels:
        app: member-mgmt
    spec:
      containers:
      - name: member-mgmt-container
        image: kjvns/member-mgmt:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: "1Gi"
            cpu: "1000m"     
          requests:
            memory: "512Mi"
            cpu: "500m"  