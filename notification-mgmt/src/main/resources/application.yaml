spring:
  application:
    name: notification-mgmt
  # PostgreSQL Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/notification_db
    driver-class-name: org.postgresql.Driver
    username: kishan
    password: password1
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000

  # JPA/Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true


server:
  port: ${SERVER_PORT:8080} # Default port is 8080
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
app:
  notification:
    email:
      max-retries: 3
      retry-delay-ms: 1000
    sms:
      max-retries: 3
      retry-delay-ms: 1000
    popup:
      max-retries: 1
      retry-delay-ms: 500